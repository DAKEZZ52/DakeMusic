<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LyriseMusic Overlay</title>
<style>
  :root{ --accent:#f59e0b; --text:#fff; --sub:#9aa4b2; --card-bg:rgba(20,24,32,.72); }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;}

  #overlay{position:fixed;inset:0;transition:opacity .45s ease}
  #overlay.idle{opacity:0}
  #overlay.paused{opacity:.55}

  /* 卡片 */
  .card{position:absolute;left:36px;bottom:36px;display:flex;align-items:center;gap:14px;
        padding:14px 22px 16px 14px;border-radius:18px;
        background:var(--card-bg);border:1px solid rgba(255,255,255,.10);
        box-shadow:0 18px 48px rgba(0,0,0,.55);color:var(--text);
        backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);}
  .card .cover{width:76px;height:76px;border-radius:12px;flex:0 0 auto;overflow:hidden;
        background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;font-size:30px}
  .card .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .card .meta{min-width:0}
  .card .title{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
  .card .artist{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
  .card .bar{width:320px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:12px;overflow:hidden}
  .card .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .6s linear}

  /* 极简 */
  .minimal{position:absolute;left:40px;bottom:40px;display:flex;align-items:center;gap:12px;
           color:var(--text);text-shadow:0 2px 10px rgba(0,0,0,.75)}
  .minimal .cover{width:40px;height:40px;border-radius:9px;flex:0 0 auto;overflow:hidden;
           background:rgba(255,255,255,.12);box-shadow:0 6px 18px rgba(0,0,0,.55);
           border:1px solid rgba(255,255,255,.14)}
  .minimal .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .minimal .wrap{position:relative}
  .minimal .text{font-size:16px;font-weight:500;white-space:nowrap;max-width:520px;overflow:hidden;text-overflow:ellipsis}
  .minimal .sep{opacity:.45;margin:0 4px}
  .minimal .artist{font-weight:400;color:rgba(255,255,255,.86)}
  .minimal .progress{position:absolute;left:0;bottom:-9px;width:100%;height:2px;background:rgba(255,255,255,.16);border-radius:1px;overflow:hidden}
  .minimal .progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:1px;transition:width .6s linear}

  /* 下一首预告 */
  .next{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:rgba(255,255,255,.62)}
  .next .nlabel{opacity:.6;flex:0 0 auto}
  .next .ncover{width:20px;height:20px;border-radius:5px;overflow:hidden;flex:0 0 auto;background:rgba(255,255,255,.14)}
  .next .ncover img{width:100%;height:100%;object-fit:cover;display:block}
  .next .ntitle{max-width:250px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .minimal .next{position:absolute;left:0;top:calc(100% + 16px);margin-top:0;white-space:nowrap}

  /* 频谱背景 */
  #spectrum{position:fixed;left:0;right:0;bottom:0;height:120px;width:100%;opacity:.45;pointer-events:none}
  #spectrum.hidden{display:none}

  /* 水印 */
  .brand{position:fixed;right:30px;bottom:26px;font-size:12px;letter-spacing:.2em;font-weight:600;
         color:rgba(255,255,255,.34);text-shadow:0 2px 8px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="spectrum" class="hidden"></canvas>
<div id="overlay" class="idle"></div>
<script>
  const q = new URLSearchParams(location.search);
  const style = q.get('style') === 'minimal' ? 'minimal' : 'card';
  const theme = q.get('theme') === 'light' ? 'light' : 'dark';
  const showBrand = q.get('brand') !== '0';
  const showNext = q.get('next') === '1';
  const showSpectrum = q.get('spectrum') === '1';

  if (theme === 'light') {
    document.documentElement.style.setProperty('--accent', '#0a84ff');
  }

  const root = document.getElementById('overlay');
  let brand = null;
  if (showBrand) {
    brand = document.createElement('div');
    brand.className = 'brand';
    brand.textContent = 'LYRISE';
  }

  let coverEl, titleEl, artistEl, barEl, currentCover = '';

  function buildCard() {
    root.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="cover">♪</div>' +
      '<div class="meta">' +
        '<div class="title"></div>' +
        '<div class="artist"></div>' +
        '<div class="bar"><i></i></div>' +
      '</div>';
    root.appendChild(card);
    if (brand) root.appendChild(brand);
    if (showNext) {
      const next = document.createElement('div');
      next.className = 'next';
      next.innerHTML = '<span class="nlabel">下一首</span><span class="ncover"></span><span class="ntitle"></span>';
      card.querySelector('.meta').appendChild(next);
    }
    coverEl = card.querySelector('.cover');
    titleEl = card.querySelector('.title');
    artistEl = card.querySelector('.artist');
    barEl = card.querySelector('.bar i');
  }

  function buildMinimal() {
    root.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'minimal';
    wrap.innerHTML =
      '<span class="cover"><img alt=""></span>' +
      '<div class="wrap">' +
        '<span class="text"><span class="t"></span><span class="sep">·</span><span class="artist"></span></span>' +
        '<span class="progress"><i></i></span>' +
      '</div>';
    root.appendChild(wrap);
    if (brand) root.appendChild(brand);
    if (showNext) {
      const next = document.createElement('div');
      next.className = 'next';
      next.innerHTML = '<span class="nlabel">下一首</span><span class="ncover"></span><span class="ntitle"></span>';
      wrap.querySelector('.wrap').appendChild(next);
    }
    coverEl = wrap.querySelector('.cover img');
    titleEl = wrap.querySelector('.t');
    artistEl = wrap.querySelector('.artist');
    barEl = wrap.querySelector('.progress i');
  }

  style === 'minimal' ? buildMinimal() : buildCard();

  function setCover(url) {
    if (url === currentCover) return;
    currentCover = url;
    if (!coverEl) return;
    if (url) {
      coverEl.src = url;
      if (coverEl.tagName !== 'IMG') {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        coverEl.textContent = '';
        coverEl.appendChild(img);
        coverEl = img;
      }
    } else {
      if (coverEl.tagName === 'IMG') {
        const box = coverEl.parentElement;
        box.textContent = '♪';
        coverEl = box;
      }
    }
  }

  function render(state) {
    if (showSpectrum && window.__applySpectrum && Array.isArray(state.spectrum)) {
      window.__applySpectrum(state.spectrum);
    }
    if (!state || !state.title) {
      root.classList.add('idle');
      return;
    }
    root.classList.remove('idle');
    root.classList.toggle('paused', !state.playing);
    titleEl.textContent = state.title;
    artistEl.textContent = state.artist || '';
    setCover(state.cover || '');
    const ratio = state.duration > 0 ? Math.min(1, (state.current || 0) / state.duration) : 0;
    if (barEl) barEl.style.width = (ratio * 100).toFixed(2) + '%';

    const nextEl = document.querySelector('.next');
    if (nextEl) {
      if (state.next && state.next.title) {
        nextEl.style.display = 'flex';
        const cover = nextEl.querySelector('.ncover');
        const title = nextEl.querySelector('.ntitle');
        title.textContent = state.next.artist
          ? state.next.title + ' · ' + state.next.artist
          : state.next.title;
        if (state.next.cover) {
          cover.innerHTML = '<img src="' + state.next.cover + '" alt="">';
        } else {
          cover.innerHTML = '';
        }
      } else {
        nextEl.style.display = 'none';
      }
    }
  }

  fetch('/state', { cache: 'no-store' })
    .then((r) => r.json())
    .then(render)
    .catch(() => {});

  try {
    const source = new EventSource('/events' + (showSpectrum ? '?spectrum=1' : ''));
    source.onmessage = (event) => {
      try { render(JSON.parse(event.data)); } catch {}
    };
  } catch {}

  // ---------- 频谱背景（?spectrum=1） ----------
  if (showSpectrum) {
    const canvas = document.getElementById('spectrum');
    canvas.classList.remove('hidden');
    const ctx = canvas.getContext('2d');
    let levels = new Array(32).fill(0);
    let incoming = new Array(32).fill(0);

    const resize = () => {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvas.clientWidth * ratio);
      canvas.height = Math.round(canvas.clientHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    const accent = theme === 'light' ? '#0a84ff' : '#f59e0b';

    const renderSpectrum = () => {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const count = levels.length;
      const gap = 3;
      const barWidth = Math.max(2, (w - gap * (count - 1)) / count);
      const gradient = ctx.createLinearGradient(0, h, 0, 0);
      gradient.addColorStop(0, accent);
      gradient.addColorStop(1, 'rgba(255,255,255,0.65)');
      for (let i = 0; i < count; i += 1) {
        levels[i] += (incoming[i] - levels[i]) * (incoming[i] > levels[i] ? 0.5 : 0.15);
        const shaped = Math.pow(Math.max(0, levels[i]), 0.7);
        const value = Math.max(0.06, shaped);
        const barHeight = Math.max(2, value * h);
        ctx.fillStyle = gradient;
        ctx.globalAlpha = 0.35 + value * 0.65;
        ctx.beginPath();
        const radius = Math.min(barWidth / 2, 3);
        ctx.roundRect(i * (barWidth + gap), h - barHeight, barWidth, barHeight, radius);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(renderSpectrum);
    };
    requestAnimationFrame(renderSpectrum);

    window.__applySpectrum = (bins) => {
      if (Array.isArray(bins) && bins.length) incoming = bins.slice(0, 32);
    };
  }
</script>
</body>
</html>
