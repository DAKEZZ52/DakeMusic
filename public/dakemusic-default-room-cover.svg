<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- 背景渐变：深紫夜空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1145"/>
      <stop offset="0.5" stop-color="#2d1b69"/>
      <stop offset="1" stop-color="#1a0f3c"/>
    </linearGradient>
    
    <!-- 金色边框渐变 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#daa520"/>
      <stop offset="1" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <!-- 主背景 -->
  <rect width="320" height="320" fill="url(#bg)"/>

  <!-- 星星装饰 -->
  <g fill="#fff" opacity="0.6">
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="90" cy="35" r="1"/>
    <circle cx="140" cy="60" r="1.2"/>
    <circle cx="200" cy="40" r="1.5"/>
    <circle cx="250" cy="65" r="1"/>
    <circle cx="280" cy="45" r="1.3"/>
    <circle cx="60" cy="250" r="1"/>
    <circle cx="260" cy="260" r="1.2"/>
    <circle cx="160" cy="280" r="0.9"/>
  </g>

  <!-- 金色边框 -->
  <rect x="16" y="16" width="288" height="288" rx="12" 
    fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.85"/>
  
  <!-- 边框四角装饰 -->
  <path d="M16,50 L16,28 Q16,16 28,16 L50,16" 
    fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M270,16 L292,16 Q304,16 304,28 L304,50" 
    fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M16,270 L16,292 Q16,304 28,304 L50,304" 
    fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M270,304 L292,304 Q304,304 304,292 L304,270" 
    fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>

  <!-- 四角装饰圆 -->
  <circle cx="28" cy="28" r="3" fill="#ffd700"/>
  <circle cx="292" cy="28" r="3" fill="#ffd700"/>
  <circle cx="28" cy="292" r="3" fill="#ffd700"/>
  <circle cx="292" cy="292" r="3" fill="#ffd700"/>

  <!-- 音符装饰（左边） -->
  <g fill="#ffd700" opacity="0.6">
    <text x="45" y="150" font-size="24">♪</text>
    <text x="38" y="185" font-size="16">♫</text>
  </g>

  <!-- 音符装饰（右边） -->
  <g fill="#ffd700" opacity="0.6">
    <text x="255" y="145" font-size="22">♪</text>
    <text x="265" y="180" font-size="16">♫</text>
  </g>

  <!-- 中间装饰线 -->
  <line x1="80" y1="135" x2="135" y2="135" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  <line x1="185" y1="135" x2="240" y2="135" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  <path d="M160,130 L165,135 L160,140 L155,135 Z" fill="#ffd700" opacity="0.7"/>

  <!-- 主标题：DakeMusic（白色，无发光） -->
  <text x="160" y="175" text-anchor="middle" 
    font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, sans-serif" 
    font-size="40" font-weight="700" 
    fill="#ffffff"
    letter-spacing="2">DakeMusic</text>

  <!-- 副标题：Small Room（金色，无发光） -->
  <text x="160" y="205" text-anchor="middle" 
    font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, sans-serif" 
    font-size="16" 
    fill="#ffd700"
    letter-spacing="8">Small Room</text>

  <!-- 底部装饰线 -->
  <line x1="100" y1="225" x2="220" y2="225" stroke="#ffd700" stroke-width="1" opacity="0.4"/>
</svg>
